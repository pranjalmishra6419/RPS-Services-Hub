<svg viewBox="0 0 1600 700" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3FBF6"/>
      <stop offset="100%" stop-color="#E7F6EE"/>
    </linearGradient>

    <radialGradient id="blobMint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7FE0B4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7FE0B4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPeach" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB27A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFB27A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobSky" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7EC0F5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7EC0F5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobLav" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B7A0F5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#B7A0F5" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE94"/>
      <stop offset="100%" stop-color="#0F9D58"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FE3D6"/>
      <stop offset="100%" stop-color="#0FA99A"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6FB2FF"/>
      <stop offset="100%" stop-color="#2E6FE0"/>
    </linearGradient>
    <linearGradient id="gRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8FA3"/>
      <stop offset="100%" stop-color="#E23B58"/>
    </linearGradient>
    <linearGradient id="gViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C29CFF"/>
      <stop offset="100%" stop-color="#7C4FE0"/>
    </linearGradient>
    <linearGradient id="gDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F4B3E"/>
      <stop offset="100%" stop-color="#0F2E24"/>
    </linearGradient>

    <filter id="tileShadow" x="-70%" y="-70%" width="240%" height="240%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F2E24" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="softBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
  </defs>

  <rect width="1600" height="700" fill="#FFFFFF"/>

  <!-- vibrant colorful blobs for an airy, lively backdrop -->
  <circle cx="1520" cy="90" r="230" fill="url(#blobMint)" filter="url(#softBlur)"/>
  <circle cx="1560" cy="560" r="200" fill="url(#blobPeach)" filter="url(#softBlur)"/>
  <circle cx="840" cy="600" r="190" fill="url(#blobSky)" filter="url(#softBlur)"/>
  <circle cx="760" cy="80" r="150" fill="url(#blobLav)" filter="url(#softBlur)"/>

  <!-- right backdrop panel -->
  <rect x="800" y="46" width="748" height="608" rx="60" fill="url(#panelGrad)"/>

  <!-- decorative dashed orbit ring behind the grid for energy -->
  <circle cx="1086" cy="360" r="290" fill="none" stroke="#0F9D58" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="2 14" stroke-linecap="round"/>

  <!-- sparkle accents -->
  <g fill="#F5A623">
    <path d="M 1500 200 l 5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z" opacity="0.85"/>
  </g>
  <g fill="#0F9D58">
    <path d="M 860 560 l 4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z" opacity="0.7"/>
  </g>

  <!-- LEFT: bold refined text -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="90" y="150" width="34" height="4" rx="2" fill="#0F9D58"/>
    <text x="134" y="158" font-size="14" font-weight="700" letter-spacing="3" fill="#0F9D58">SERVICES HUB</text>

    <text x="88" y="248" font-size="62" font-weight="800" fill="#12271F" letter-spacing="-0.5">Services For</text>
    <text x="88" y="318" font-size="62" font-weight="800" fill="#12271F" letter-spacing="-0.5">Your Everyday</text>
    <text x="88" y="388" font-size="62" font-weight="800" fill="#0F9D58" letter-spacing="-0.5">Needs</text>

    <text font-size="19" fill="#5B6A64">
      <tspan x="90" y="440">From home maintenance to vehicle care, technology</tspan>
      <tspan x="90" y="468">and cleaning — find the right service, all in one place.</tspan>
    </text>

    <!-- verified badge pill -->
    <g transform="translate(90,510)">
      <rect width="240" height="46" rx="23" fill="#F3FBF6" stroke="#CDEBDB" stroke-width="1.5"/>
      <circle cx="26" cy="23" r="12" fill="url(#gGreen)"/>
      <path d="M 20 23 L 24 28 L 33 17" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="29" font-size="15" font-weight="700" fill="#12271F">Verified professionals</text>
    </g>
  </g>

  <!-- RIGHT: vibrant bento-style icon grid -->

  <!-- Home -->
  <g transform="translate(892,158) rotate(-4)" filter="url(#tileShadow)">
    <rect x="-88" y="-88" width="176" height="176" rx="38" fill="url(#gGreen)"/>
    <path d="M -27 6 L 0 -22 L 27 6 L 27 28 L 10 28 L 10 6 L -10 6 L -10 28 L -27 28 Z" fill="#FFFFFF"/>
  </g>

  <!-- Electrical -->
  <g transform="translate(1086,142) rotate(3)" filter="url(#tileShadow)">
    <rect x="-88" y="-88" width="176" height="176" rx="38" fill="url(#gAmber)"/>
    <path d="M 6 -26 L -17 7 L 0 7 L -6 28 L 20 -6 L 3 -6 Z" fill="#FFFFFF"/>
  </g>

  <!-- Tech -->
  <g transform="translate(1280,172) rotate(-3)" filter="url(#tileShadow)">
    <rect x="-88" y="-88" width="176" height="176" rx="38" fill="url(#gTeal)"/>
    <path d="M -21 -8 L -34 5 L -21 18" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 21 -8 L 34 5 L 21 18" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="5" y1="-15" x2="-5" y2="22" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Plumbing -->
  <g transform="translate(892,376) rotate(3)" filter="url(#tileShadow)">
    <rect x="-88" y="-88" width="176" height="176" rx="38" fill="url(#gBlue)"/>
    <path d="M 0 -28 C 16 -6, 21 10, 11 23 C 0 35, -16 27, -16 12 C -16 2, -9 -5, 0 -28 Z" fill="#FFFFFF"/>
  </g>

  <!-- Vehicle -->
  <g transform="translate(1086,392) rotate(-3)" filter="url(#tileShadow)">
    <rect x="-88" y="-88" width="176" height="176" rx="38" fill="url(#gRose)"/>
    <path d="M -30 9 L -22 -9 C -20 -14 -15 -16 -8 -16 L 11 -16 C 18 -16 23 -14 25 -9 L 33 9 L 30 20 L -28 20 Z" fill="#FFFFFF"/>
    <circle cx="-15" cy="20" r="6.5" fill="#FFFFFF"/>
    <circle cx="18" cy="20" r="6.5" fill="#FFFFFF"/>
  </g>

  <!-- Cleaning -->
  <g transform="translate(1280,364) rotate(4)" filter="url(#tileShadow)">
    <rect x="-88" y="-88" width="176" height="176" rx="38" fill="url(#gViolet)"/>
    <path d="M -7 26 L -18 -9 C -20 -19 -13 -28 -2 -28 C 9 -28 16 -19 14 -9 L 7 26 Z" fill="#FFFFFF"/>
    <circle cx="18" cy="-22" r="3.2" fill="#FFFFFF"/>
    <circle cx="27" cy="-8" r="2.6" fill="#FFFFFF"/>
    <circle cx="14" cy="-33" r="2.6" fill="#FFFFFF"/>
  </g>

  <!-- bottom brand strip -->
  <g transform="translate(1086,566)" filter="url(#tileShadow)">
    <rect x="-286" y="-40" width="572" height="80" rx="40" fill="url(#gDark)"/>
    <text x="0" y="7" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="0.5" fill="#FFFFFF" text-anchor="middle">6 categories. One trusted platform.</text>
  </g>
</svg>
